name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    # composer.json resolves migears/template through a path repository
    # ("../migears-template") and it is not on Packagist, so that package has to
    # sit beside this one rather than under vendor/. That is also why every
    # command runs from a subdirectory: "../migears-template" is relative to this
    # package's own directory, so this package cannot be checked out at the
    # workspace root.
    defaults:
      run:
        working-directory: migears-pages

    steps:
      - name: Check out this package
        uses: actions/checkout@v7
        with:
          path: migears-pages

      # Its default branch, so the pair moves together.
      - name: Check out migears-template
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/migears-template
          path: migears-template

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: vendor/bin/phpunit
